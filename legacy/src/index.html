<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deep Schema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>
<header class="hud">
  <div class="loc"><div class="zone" id="hZone">Seabase</div><div class="depth" id="hDepth">12 m</div></div>
  <div class="o2" id="hO2" hidden><div class="lbl"><span>O₂</span><span id="hO2v">100</span></div><div class="bar"><div class="fill" id="hO2f" style="width:100%"></div></div></div>
  <div class="cash"><div class="amt" id="hCash">0</div><div class="sub" id="hCashSub">Salvage</div></div>
</header>
<section class="sheet" id="sheet" aria-live="polite"></section>
<div class="toast" id="toast" style="opacity:0"></div>
<aside class="coach" id="coach" hidden aria-live="polite"></aside>

<script src="../config/config.js"></script>
<script src="content.js"></script>
<script src="game.js"></script>
</body>
</html>
